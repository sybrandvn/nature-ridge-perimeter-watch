[project]
name = "nature-ridge-perimeter-watch"
version = "0.1.0"
description = "Motion-based perimeter fence monitoring from a Telegram security camera feed."
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "telethon>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
