# Per-camera fence geometry and overrides.
#
# `order` (fence position): 2026-08-28, user decided against running gate 1's
# inference (`scripts/infer_camera_order.py`) -- no reason to expect the physical
# fence order differs from the numerical/alphabetical camera-id order, so `order`
# is just that sort (cam01=0, cam01a=1, cam01b=2, cam02=3, ... cam16=17). Gate 1
# is therefore resolved without inference; `infer_camera_order.py` is kept for
# reference/validation but is no longer on the critical path.
#
# `fence`, `outside`, `depth_cutoff`, and `ignore` are hand-drawn (Phase 0c) and
# will later be revised by the browser zone editor (Phase 2) — an empty entry with
# just `id`/`aliases`/`order` is valid and means "not yet configured", which
# classify.py treats as ambiguous rather than a crash.
#
# `outside` (`left`/`right`) is plain screen position: for a query point, compare its
# x to the fence's x at that same row (interpolated along the polyline) -- larger x is
# `right`, smaller is `left`. Point order in the polyline doesn't matter (2026-08-30:
# replaced an earlier direction-of-travel/"which hand" convention that inverted this
# for any top-to-bottom-traced fence -- see docs/plan.md Phase 0c step 11 and
# src/zones.py). Per the user, the exterior side of the fence (what `outside` picks
# out) is compass south for this property.
#
# 2026-08-28: flipped left<->right for every camera except cam08 (whose points
# are ordered bottom-to-top, opposite of everyone else, and was independently
# hand-confirmed: "vegetation/outside is to the right"). Open ground/cleared
# area in frame is the INTERIOR (patrolled) side, not the exterior -- the
# earlier assumption had it backwards for the majority.
unknown_camera_id: "unknown"

# Discovered from real backfilled captions (format: "Cam Alert*: ... NATURE RIDGE
# COMPLEX, MOTIONVIEWER <n> @ <date> <time>"). `order` is numerical/alphabetical
# by id (see note above); `fence`/`outside`/`depth_cutoff`/`ignore` are still
# unset for cameras with no spike/label geometry yet, filled in by the browser
# zone editor (Phase 2).
cameras:
  - id: cam01
    aliases: ["MOTIONVIEWER 1"]
    order: 0
    # User hand-traced the fence in red over an extracted reference frame;
    # points extracted by color-thresholding the red pixels back out (5
    # y-bands, top to bottom). Open ground is to the left walking first
    # point to last, same orientation as cam05/cam06.
    fence: [[0.4111, 0.1656], [0.3436, 0.374], [0.2748, 0.5823], [0.2059, 0.7906], [0.1381, 0.999]]
    outside: right
    depth_cutoff: 0.05
    # 2026-09-05: fence_bottom, traced by the user over data/history/cam01/10560.mp4.
    # `outside: right` re-confirmed via side_name against the same reference
    # points as the top-rail line.
    fence_bottom:
      [[0.454, 0.1], [0.4406, 0.3232], [0.4268, 0.5464], [0.4133, 0.7695], [0.3999, 0.9927]]
