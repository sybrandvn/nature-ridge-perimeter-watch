# Per-camera fence geometry and overrides.
#
# `order` (fence position), `fence`, `far_side`, `depth_cutoff`, and `ignore` are
# discovered/filled in by scripts/infer_camera_order.py (Phase 0b) and the browser
# zone editor (Phase 2) — an empty entry with just `id`/`aliases` is valid and means
# "not yet configured", which classify.py treats as ambiguous rather than a crash.
#
# `far_side` (`left`/`right`) is always relative to the directed polyline (first
# point -> second point) in that camera's own frame, not a compass direction, since
# each camera's mounting angle differs. Per the user, the exterior side of the
# fence (what `far_side` picks out) is compass south for this property.
unknown_camera_id: "unknown"

# Discovered from real backfilled captions (format: "Cam Alert*: ... NATURE RIDGE
# COMPLEX, MOTIONVIEWER <n> @ <date> <time>"). `order`/`fence`/`far_side`/
# `depth_cutoff`/`ignore` are still unset — filled in by scripts/infer_camera_order.py
# (Phase 0b) and the browser zone editor (Phase 2).
cameras:
  - id: cam01
    aliases: ["MOTIONVIEWER 1"]
  # cam01a/cam01b: distinct feeds seen later in the caption history (likely
  # camera 1 was replaced/split into two devices) — kept separate from cam01
  # rather than merged, since merging non-identical cameras would corrupt
  # fence-order inference. Confirm with the physical layout and rename/merge
  # if they are in fact the same position.
  - id: cam01a
    aliases: ["MOTIONVIEWER 1A"]
  - id: cam01b
    aliases: ["MOTIONVIEWER 1B"]
  - id: cam02
    aliases: ["MOTIONVIEWER 2"]
  - id: cam03
    aliases: ["MOTIONVIEWER 3"]
  - id: cam04
    aliases: ["MOTIONVIEWER 4"]
  - id: cam05
    aliases: ["MOTIONVIEWER 5"]
    # Drawn from data/history/cam05/4800.mp4 (middle frame). Provisional --
    # 2026-08-28 attempts to aim at picket tips over-corrected back toward a
    # perpendicular guess; reverted to this earlier, closer approximation
    # pending a user-hand-drawn reference (see docs/plan.md fence versioning
    # note). Open ground is to the left of that line walking from the first
    # point to the second.
    fence: [[0.421875, 0.25], [0.3125, 0.979166]]
    far_side: left
    depth_cutoff: 0.05
  - id: cam06
    aliases: ["MOTIONVIEWER 6"]
    # Drawn from data/history/cam06/21520.mp4 (crawl incident clip). Provisional
    # -- 2026-08-28 tip-aiming attempt regressed toward a perpendicular guess;
    # reverted to this earlier, closer approximation pending a user-hand-drawn
    # reference (see docs/plan.md fence versioning note). Open background is
    # to the left of that line walking from the first point to the second.
    fence: [[0.4375, 0.166666], [0.4, 0.958333]]
    far_side: left
    depth_cutoff: 0.05
  - id: cam07
    aliases: ["MOTIONVIEWER 7"]
  - id: cam08
    aliases: ["MOTIONVIEWER 8"]
    # Worked example (see README.md "How to draw a fence polyline"): fence runs
    # diagonally bottom-left to top-middle in frame; vegetation/outside is to
    # the right of that line walking from the first point to the second.
    fence: [[0.03, 0.96], [0.47, 0.06]]
    far_side: right
    depth_cutoff: 0.05
  - id: cam09
    aliases: ["MOTIONVIEWER 9"]
  - id: cam10
    aliases: ["MOTIONVIEWER 10"]
  - id: cam11
    aliases: ["MOTIONVIEWER 11"]
  - id: cam12
    aliases: ["MOTIONVIEWER 12"]
  - id: cam13
    aliases: ["MOTIONVIEWER 13"]
  - id: cam14
    aliases: ["MOTIONVIEWER 14"]
  - id: cam15
    aliases: ["MOTIONVIEWER 15"]
  - id: cam16
    aliases: ["MOTIONVIEWER 16"]

