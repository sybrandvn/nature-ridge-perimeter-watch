# Per-camera fence geometry and overrides.
#
# `order` (fence position), `fence`, `far_side`, `depth_cutoff`, and `ignore` are
# discovered/filled in by scripts/infer_camera_order.py (Phase 0b) and the browser
# zone editor (Phase 2) — an empty entry with just `id`/`aliases` is valid and means
# "not yet configured", which classify.py treats as ambiguous rather than a crash.
#
# `far_side` (`left`/`right`) is always relative to the directed polyline (first
# point -> second point) in that camera's own frame, not a compass direction, since
# each camera's mounting angle differs. Per the user, the exterior side of the
# fence (what `far_side` picks out) is compass south for this property.
unknown_camera_id: "unknown"

# Discovered from real backfilled captions (format: "Cam Alert*: ... NATURE RIDGE
# COMPLEX, MOTIONVIEWER <n> @ <date> <time>"). `order`/`fence`/`far_side`/
# `depth_cutoff`/`ignore` are still unset — filled in by scripts/infer_camera_order.py
# (Phase 0b) and the browser zone editor (Phase 2).
cameras:
  - id: cam01
    aliases: ["MOTIONVIEWER 1"]
    # User hand-traced the fence in red over an extracted reference frame;
    # points extracted by color-thresholding the red pixels back out (5
    # y-bands, top to bottom). Open ground is to the left walking first
    # point to last, same orientation as cam05/cam06.
    fence: [[0.4111, 0.1656], [0.3436, 0.374], [0.2748, 0.5823], [0.2059, 0.7906], [0.1381, 0.999]]
    far_side: left
    depth_cutoff: 0.05
  # cam01a: confirmed by the user to be mounted at the exact same physical spot as
  # cam01 -- a straight replacement, not a second camera. Matches the data: cam01's
  # last clip is 2025-09-04, cam01a's first is 2025-09-13. Kept as separate camera
  # ids anyway (not merged) since the backfill/labels/spike pipeline is keyed by
  # camera_id and merging would need every downstream row relabelled.
  # cam01b: a different device, started 2025-09-11 (overlaps cam01a) -- not
  # confirmed same spot as cam01/cam01a. Treat as a distinct position until checked.
  - id: cam01a
    aliases: ["MOTIONVIEWER 1A"]
    # Same red-trace/color-threshold method as cam01 (same physical mount).
    fence: [[0.3975, 0.1823], [0.3285, 0.3844], [0.2582, 0.5865], [0.188, 0.7885], [0.1191, 0.9906]]
    far_side: left
    depth_cutoff: 0.05
  # Confirmed by the user 2026-08-28: faces the OPPOSITE way to most perimeter
  # cameras -- open ground in frame is the interior side, not exterior.
  - id: cam01b
    aliases: ["MOTIONVIEWER 1B"]
    # Red-trace/color-threshold method. Reversed mount (see comment above): the
    # polyline runs the opposite diagonal (x increases with y), so open ground
    # -- the interior side here -- comes out as far_side: right, not left.
    # Usually illuminated at night by a yard spotlight, same as cam16.
    fence: [[0.2479, 0.1385], [0.3038, 0.3536], [0.3609, 0.5688], [0.4181, 0.7839], [0.4744, 0.999]]
    far_side: right
    depth_cutoff: 0.05
  - id: cam02
    aliases: ["MOTIONVIEWER 2"]
    # Red-trace/color-threshold method. Open ground to the left, first point to last.
    fence: [[0.4701, 0.1469], [0.3906, 0.3599], [0.3095, 0.5729], [0.2285, 0.7859], [0.1488, 0.999]]
